services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 80
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=DESKTOP-I0GMR4R;Database=Auth;User=auth_user;Password=admin123!;TrustServerCertificate=true;
    healthcheck:
      test: curl --silent --fail http://localhost:80/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 3
